# CI —— 每个 PR 与每次推送都跑。job 名（tests、tests-mysql）要与 .platform/project.yaml 的
# required_status_checks 一致，并在 GitHub 分支保护里设为 main 的必需检查。
#
# OpenClaw 的 Worker 要等 PR 的 CI 全绿才把 run 交给人批准，所以这里是准入的依据：
# .platform/commands.yaml 里的每条检查，这里都以逐字相同的参数跑；Worker 沙箱里跑不了的
# （TestClient 的 pytest、要 MySQL 的测试）只在这里跑。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      # 与 .platform/commands.yaml 的 tests.rules、tests.api 参数逐字相同。
      - run: python -I -m unittest discover -s tests -t . -p "test_*_rules.py"
      - run: python -I -m pytest -q
      - run: python -m compileall -q app

  # 同一套测试对着与共享 infra_mysql 同一大版本的一次性库再跑一遍；账号密码只存在于这台 CI 机器上。
  tests-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      AI_API_TEST_DATABASE_URL: mysql+pymysql://ci:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -I -m pytest -q
