[project]
name = "acuven-ai-api"
version = "0.1.0"
description = "Independent AI capability API for Acuven business modules"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
